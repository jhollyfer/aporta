name: Deploy to Coolify

# The address and the target of the deploy are secrets, never written here
# (`_standards/tooling.md` §8.3, `DECISIONS.md` #272): a UUID copied from another project
# would redeploy the other project's application, and the site host in place of the panel
# answers the route with the app's 404 HTML.
on:
  workflow_call:
    secrets:
      COOLIFY_URL:
        required: true
      COOLIFY_TOKEN:
        required: true
      COOLIFY_API_UUID:
        required: true
      COOLIFY_APP_UUID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Coolify Deploy
    runs-on: ubuntu-latest
    steps:
      # POST, and not GET: since Coolify v4.2 the GET answers 405. `-f` alone hides the body and
      # leaves a 404 with no cause, so the status goes to `-w` and the body to a file; outside
      # 2xx the step prints both (`DECISIONS.md` #274). The response must bring
      # `deployment_uuid`: without it the request was accepted and nothing was queued (wrong
      # uuid or out of the token's reach).
      #
      # Each value loses space and line break first (`tr -d '[:space:]'`): a secret pasted with
      # `\n` becomes a broken header. An empty secret fails naming it, and so does a
      # `COOLIFY_URL` with a path: it is the panel's base, and the endpoint is built here.
      #
      # ATTENTION: the UUID is the APPLICATION's, not the instance's. The value is at the end of
      # the application's URL in the Coolify panel.
      - name: Deploy da API e do app
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          url=$(clean "$COOLIFY_URL")
          token=$(clean "$COOLIFY_TOKEN")
          api_uuid=$(clean "$COOLIFY_API_UUID")
          app_uuid=$(clean "$COOLIFY_APP_UUID")

          for pair in "COOLIFY_URL:$url" "COOLIFY_TOKEN:$token" "COOLIFY_API_UUID:$api_uuid" "COOLIFY_APP_UUID:$app_uuid"; do
            if [ -z "${pair#*:}" ]; then
              echo "secret ${pair%%:*} vazio ou ausente" >&2; exit 1
            fi
          done

          # Whatever follows the host after the scheme is a path.
          rest="${url#*://}"
          case "${rest%/}" in
            */*) echo "COOLIFY_URL deve ser só a base do painel, sem caminho (veio com '/' depois do host)" >&2; exit 1 ;;
          esac

          endpoint="${url%/}/api/v1/deploy"
          response="$RUNNER_TEMP/coolify-response.txt"

          for uuid in "$api_uuid" "$app_uuid"; do
            status=$(curl -sS -X POST "$endpoint" \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              -d "{\"uuid\":\"$uuid\",\"force\":false}" \
              -o "$response" -w '%{http_code}')
            case "$status" in
              2??) ;;
              *)
                echo "Coolify respondeu $status para $uuid: $(head -c 300 "$response" 2>/dev/null)" >&2
                exit 1
                ;;
            esac
            grep -q '"deployment_uuid"' "$response" \
              || { echo "Coolify não enfileirou $uuid: $(head -c 300 "$response" 2>/dev/null)" >&2; exit 1; }
          done

      # The trigger is asynchronous: the job only finishes green when the API answers on
      # `/health-check` and the app serves `/revision.txt` with this commit's SHA.
      # Checking by the body, never by the status: the SSR catch-all answers
      # 200 with HTML for a missing file.
      - name: Smoke test
        env:
          API_URL: https://api-aporta.maiyu.com.br
          APP_URL: https://aporta.maiyu.com.br
          REVISION: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 8); do
            api=$(curl -fsS --max-time 10 "$API_URL/health-check" || true)
            app=$(curl -fsS --max-time 10 "$APP_URL/revision.txt" || true)
            if printf '%s' "$api" | grep -q '"ok"' && [ "$app" = "$REVISION" ]; then
              echo "API e app no ar com $REVISION (tentativa $attempt)."
              exit 0
            fi
            echo "Ainda subindo (tentativa $attempt): api=$(printf '%s' "$api" | head -c 80) app=$(printf '%s' "$app" | head -c 80)"
            sleep 15
          done
          echo "API ou app não chegaram em $REVISION em dois minutos." >&2
          exit 1
